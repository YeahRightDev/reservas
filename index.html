<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>CRYPTO · Business Club</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --bg-main: #07080b;
    --surface: #111319;
    --border: rgba(255, 255, 255, 0.08);
    --border-focus: rgba(255, 255, 255, 0.25);
    --text-primary: #f8fafc;
    --text-muted: #64748b;
    --status-active: #10b981;
    --f-main: 'Plus Jakarta Sans', sans-serif;
  }
  
  html, body {
    background-color: var(--bg-main);
    font-family: var(--f-main);
    color: var(--text-primary);
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }

  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 50% -10%, rgba(255, 255, 255, 0.04), transparent 60%);
  }

  .card-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .btn-action {
    min-height: 48px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s ease;
    user-select: none;
  }
  .btn-action:active { transform: scale(0.98); }

  .btn-white {
    background: #ffffff;
    color: #07080b;
  }
  .btn-white:hover { background: #e2e8f0; }

  .btn-dark {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--text-primary);
  }
  .btn-dark:hover { background: rgba(255, 255, 255, 0.08); }

  .btn-check-in {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #34d399;
  }

  .btn-checked {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--text-muted);
  }

  .field-input {
    width: 100%; height: 48px; padding: 0 16px; font-size: 14px; color: #fff; border-radius: 12px;
    background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
    outline: none; transition: border-color 0.15s;
  }
  .field-input:focus { border-color: var(--border-focus); }

  .modal {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center;
  }
  .modal.is-open { display: flex; }
  .modal-backdrop {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(8px);
  }
  .modal-sheet {
    position: relative; width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto;
    border-radius: 24px 24px 0 0; background: #0f1117; border-top: 1px solid var(--border);
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
  }
</style>
</head>

<body>

<!-- ============ HEADER TIPOGRÁFICO CLEAN ============ -->
<header class="sticky top-0 z-30 bg-[#07080b]/90 backdrop-blur-md border-b border-white/5">
  <div class="max-w-xl mx-auto px-4 py-3.5">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-base font-black tracking-[0.22em] text-white uppercase leading-none">CRYPTO</h1>
        <p class="text-[10px] text-slate-400 font-bold tracking-[0.25em] mt-1.5 uppercase">BUSINESS CLUB</p>
      </div>

      <!-- Estado de Conexión -->
      <div id="netBadge" class="flex items-center gap-2 text-xs px-3 py-1.5 rounded-full bg-white/[0.03] border border-white/10 text-slate-400">
        <span id="netDot" class="w-2 h-2 rounded-full bg-slate-600"></span>
        <span id="netLabel" class="text-[11px] font-medium">Conectando...</span>
      </div>
    </div>

    <!-- Indicador Único: Reservas -->
    <div class="mt-4">
      <div class="card-panel p-3 text-center">
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">Reservas Registradas</span>
        <span id="kpiReservas" class="text-2xl font-extrabold text-white mt-0.5 block">0</span>
      </div>
    </div>

    <!-- Buscador y Acciones -->
    <div class="flex gap-2 mt-3">
      <input id="searchInput" type="search" placeholder="Buscar por cliente o RP..." class="field-input text-xs h-11 flex-1" autocomplete="off">
      <button id="btnReport" class="btn-action btn-dark w-11 h-11 shrink-0 p-0 text-sm" title="Copiar reporte general">📋</button>
    </div>
  </div>
</header>

<!-- ============ LISTA DE RESERVAS ============ -->
<main class="max-w-xl mx-auto px-4 pt-4 pb-32">
  <div id="errorBanner" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-medium"></div>
  <div id="listContainer" class="space-y-2">
    <!-- Carga dinámica -->
  </div>
</main>

<!-- ============ BOTONES INFERIORES ============ -->
<div class="fixed bottom-0 left-0 right-0 z-40 p-4 bg-gradient-to-t from-[#07080b] via-[#07080b]/90 to-transparent pointer-events-none">
  <div class="max-w-xl mx-auto grid grid-cols-2 gap-2.5 pointer-events-auto">
    <button id="btnOpenBulk" class="btn-action btn-dark">📋 Carga Masiva</button>
    <button id="btnOpenNew" class="btn-action btn-white">+ Nueva Reserva</button>
  </div>
</div>

<!-- ============ MODAL 1: NUEVA RESERVA ============ -->
<div id="modalNew" class="modal">
  <div class="modal-backdrop" data-close></div>
  <form id="formNew" class="modal-sheet">
    <div class="w-8 h-1 rounded-full bg-white/10 mx-auto mb-4"></div>
    <h2 class="text-base font-bold text-white mb-4 tracking-tight">Nueva Reserva Individual</h2>

    <label class="text-[11px] text-slate-400 font-semibold block mb-1 uppercase tracking-wider">Nombre del Titular *</label>
    <input id="inNombre" type="text" class="field-input mb-3" placeholder="Ej. Carlos Mendoza" required autocomplete="off">

    <label class="text-[11px] text-slate-400 font-semibold block mb-1 uppercase tracking-wider">Cantidad de Personas (PAX) *</label>
    <input id="inPax" type="number" class="field-input mb-3" placeholder="Ej. 6" min="1" max="99" required>

    <label class="text-[11px] text-slate-400 font-semibold block mb-1 uppercase tracking-wider">RP / Promotor (Opcional)</label>
    <input id="inRp" type="text" class="field-input mb-6" placeholder="Ej. Alex" autocomplete="off">

    <div class="grid grid-cols-2 gap-2">
      <button type="button" class="btn-action btn-dark" data-close>Cancelar</button>
      <button type="submit" class="btn-action btn-white">Guardar</button>
    </div>
  </form>
</div>

<!-- ============ MODAL 2: CARGA MASIVA ============ -->
<div id="modalBulk" class="modal">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-sheet">
    <div class="w-8 h-1 rounded-full bg-white/10 mx-auto mb-4"></div>
    <h2 class="text-base font-bold text-white mb-1 tracking-tight">Importación Masiva de WhatsApp</h2>
    <p class="text-xs text-slate-400 mb-3">Pega la lista completa. El sistema procesa nombres y pax de forma automática.</p>

    <textarea id="bulkArea" rows="6" class="field-input h-auto p-3 text-xs font-mono mb-3" placeholder="Jorge - 10 personas&#10;Emmanuel 6 pax&#10;Valeria 3"></textarea>
    
    <label class="text-[11px] text-slate-400 font-semibold block mb-1 uppercase tracking-wider">Asignar RP General (Opcional)</label>
    <input id="bulkRp" type="text" class="field-input mb-4 text-xs h-10" placeholder="Ej. RP Alex">

    <div id="bulkSummary" class="text-xs font-semibold text-slate-300 mb-4"></div>

    <div class="grid grid-cols-2 gap-2">
      <button type="button" class="btn-action btn-dark" data-close>Cancelar</button>
      <button id="btnConfirmBulk" class="btn-action btn-white" disabled>Importar Lista</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, addDoc, updateDoc, deleteDoc, writeBatch, doc, onSnapshot, serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsrfljU9_tUG_AuiX1bi6jpLA7clNhuTE",
  authDomain: "reservas-a670d.firebaseapp.com",
  projectId: "reservas-a670d",
  storageBucket: "reservas-a670d.firebasestorage.app",
  messagingSenderId: "788113476624",
  appId: "1:788113476624:web:e17b153b25dfaa400cce95"
};

const COLECCION = "reservaciones";
let db, colRef, reservas = [], busqueda = "";

const $ = id => document.getElementById(id);

function openModal(id) { $(id).classList.add('is-open'); }
function closeModal(id) { $(id).classList.remove('is-open'); }
document.querySelectorAll('[data-close]').forEach(el => {
  el.addEventListener('click', () => {
    closeModal('modalNew');
    closeModal('modalBulk');
  });
});

function render() {
  const q = busqueda.toLowerCase().trim();
  const filtradas = reservas.filter(r => !q || r.nombre.toLowerCase().includes(q) || (r.rp && r.rp.toLowerCase().includes(q)));

  filtradas.sort((a, b) => (a.llegado === b.llegado ? a.nombre.localeCompare(b.nombre) : a.llegado ? 1 : -1));

  $('kpiReservas').textContent = reservas.length;

  const container = $('listContainer');
  if (!filtradas.length) {
    container.innerHTML = `<div class="text-center py-14 text-slate-500 text-xs">No hay reservas en la lista</div>`;
    return;
  }

  container.innerHTML = filtradas.map(r => `
    <div class="card-panel p-3.5 flex items-center justify-between gap-3 ${r.llegado ? 'opacity-35' : ''}">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <h3 class="font-bold text-sm text-white truncate ${r.llegado ? 'line-through' : ''}">${r.nombre}</h3>
          ${r.rp ? `<span class="text-[10px] px-2 py-0.5 rounded bg-white/5 border border-white/10 text-slate-400 font-medium">${r.rp}</span>` : ''}
        </div>
        <p class="text-xs text-slate-400 font-medium mt-0.5">${r.pax} Personas</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleLlegado('${r.id}', ${!r.llegado})" class="btn-action ${r.llegado ? 'btn-checked' : 'btn-check-in'} px-3.5 py-1.5 text-xs h-9">
          ${r.llegado ? '✓ Adentro' : 'Entrada'}
        </button>
        <button onclick="eliminarReserva('${r.id}')" class="text-slate-600 hover:text-red-400 p-2 text-xs transition-colors">✕</button>
      </div>
    </div>
  `).join('');
}

window.toggleLlegado = (id, nuevoEstado) => {
  updateDoc(doc(db, COLECCION, id), { llegado: nuevoEstado });
};

window.eliminarReserva = (id) => {
  if (confirm("¿Borrar esta reserva?")) {
    deleteDoc(doc(db, COLECCION, id));
  }
};

$('searchInput').addEventListener('input', e => {
  busqueda = e.target.value;
  render();
});

$('btnOpenNew').addEventListener('click', () => openModal('modalNew'));$('formNew').addEventListener('submit', async e => {
  e.preventDefault();
  const nombre = $('inNombre').value.trim();
  const pax = parseInt($('inPax').value, 10);
  const rp = $('inRp').value.trim();

  if (!nombre || !pax) return;

  await addDoc(colRef, {
    nombre,
    pax,
    rp,
    llegado: false,
    creado: serverTimestamp()
  });

  $('formNew').reset();
  closeModal('modalNew');
});

let bulkItems = [];
$('btnOpenBulk').addEventListener('click', () => openModal('modalBulk'));

$('bulkArea').addEventListener('input', e => {
  const text = e.target.value;
  const lines = text.split('\n');
  bulkItems = [];

  lines.forEach(line => {
    line = line.replace(/^\s*\[.*?\]\s*/, '').replace(/^[-•*]\s*/, '').trim();
    if (!line) return;

    const match = line.match(/(\d+)/);
    if (match) {
      const pax = parseInt(match[1], 10);
      let nombre = line.replace(/\d+\s*(personas?|pax|pers)?/gi, '').replace(/[-/]/g, '').trim();
      if (!nombre) nombre = "Reserva " + pax + " pax";
      bulkItems.push({ nombre, pax });
    }
  });

  $('bulkSummary').textContent = bulkItems.length ? `${bulkItems.length} reservas procesadas` : 'Sin datos válidos';
  $('btnConfirmBulk').disabled = !bulkItems.length;
});

$('btnConfirmBulk').addEventListener('click', async () => {
  if (!bulkItems.length) return;
  const generalRp = $('bulkRp').value.trim();

  const batch = writeBatch(db);
  bulkItems.forEach(item => {
    const newRef = doc(colRef);
    batch.set(newRef, {
      nombre: item.nombre,
      pax: item.pax,
      rp: generalRp,
      llegado: false,
      creado: serverTimestamp()
    });
  });

  await batch.commit();
  $('bulkArea').value = '';$('bulkRp').value = '';
  bulkItems = [];
  closeModal('modalBulk');
});

$('btnReport').addEventListener('click', () => {
  const totalRes = reservas.length;
  const ingresadas = reservas.filter(r => r.llegado).length;

  const texto = `📋 *REPORTE DE ACCESO · CRYPTO BUSINESS CLUB*\n\n` +
    `Total Reservas: ${totalRes}\n` +
    `Ingresaron: ${ingresadas}\n` +
    `Pendientes: ${totalRes - ingresadas}`;

  navigator.clipboard.writeText(texto);
  alert("Reporte copiado al portapapeles.");
});

function init() {
  const app = initializeApp(firebaseConfig);
  try {
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch (e) {
    db = getFirestore(app);
  }
  colRef = collection(db, COLECCION);

  onSnapshot(colRef, snap => {
    reservas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    $('netDot').className = "w-2 h-2 rounded-full bg-emerald-400";
    $('netLabel').textContent = "En vivo";
    $('errorBanner').classList.add('hidden');
    render();
  }, err => {
    console.error(err);
    $('errorBanner').textContent = "Error de acceso: Asegúrate de publicar las reglas públicas en Firebase Console.";
    $('errorBanner').classList.remove('hidden');
  });
}

// Registro del Service Worker para PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

init();
</script>
</body>
</html>
